{% extends 'base.html' %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<div class="min-h-screen bg-slate-100">

    <div class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center">

        <h1 class="text-3xl font-bold text-slate-900">

            CRM Dashboard

        </h1>

        <a href="/logout/"
           class="bg-red-500 hover:bg-red-600 text-white px-5 py-3 rounded-2xl">

            Logout

        </a>

    </div>


    <div class="max-w-7xl mx-auto px-6 py-10">

        <div class="bg-white rounded-3xl shadow-xl overflow-hidden">

            <div class="overflow-x-auto">

                <table class="w-full">

                    <thead class="bg-slate-100">

                        <tr>

                            <th class="px-6 py-4 text-left">
                                Name
                            </th>

                            <th class="px-6 py-4 text-left">
                                Phone
                            </th>

                            <th class="px-6 py-4 text-left">
                                Email
                            </th>

                            <th class="px-6 py-4 text-left">
                                City
                            </th>

                            <th class="px-6 py-4 text-left">
                                Service
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for lead in leads %}

                        <tr class="border-t border-slate-200">

                            <td class="px-6 py-4">
                                {{ lead.name }}
                            </td>

                            <td class="px-6 py-4">
                                {{ lead.phone }}
                            </td>

                            <td class="px-6 py-4">
                                {{ lead.email }}
                            </td>

                            <td class="px-6 py-4">
                                {{ lead.city }}
                            </td>

                            <td class="px-6 py-4">
                                {{ lead.service }}
                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

{% endblock %}
