{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LeadFlow CRM{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    {% tailwind_css %}

    <style>
        body { font-family: 'Inter', sans-serif; }
        html { scroll-behavior: smooth; }

        /* ── Page-enter fade ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.92); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes slideRight {
            from { opacity: 0; transform: translateX(-30px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideLeft {
            from { opacity: 0; transform: translateX(30px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes countUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0%   { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        @keyframes pulse-ring {
            0%   { box-shadow: 0 0 0 0 rgba(124,58,237,0.4); }
            70%  { box-shadow: 0 0 0 12px rgba(124,58,237,0); }
            100% { box-shadow: 0 0 0 0 rgba(124,58,237,0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-8px); }
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes gradient-shift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Utility animation classes */
        .anim-fade-up   { animation: fadeUp 0.6s ease both; }
        .anim-fade-in   { animation: fadeIn 0.5s ease both; }
        .anim-scale-in  { animation: scaleIn 0.5s cubic-bezier(.34,1.56,.64,1) both; }
        .anim-slide-r   { animation: slideRight 0.6s ease both; }
        .anim-slide-l   { animation: slideLeft 0.6s ease both; }

        /* Stagger delays */
        .delay-100 { animation-delay: .10s; }
        .delay-150 { animation-delay: .15s; }
        .delay-200 { animation-delay: .20s; }
        .delay-300 { animation-delay: .30s; }
        .delay-400 { animation-delay: .40s; }
        .delay-500 { animation-delay: .50s; }
        .delay-600 { animation-delay: .60s; }
        .delay-700 { animation-delay: .70s; }
        .delay-800 { animation-delay: .80s; }

        /* Hover lift card */
        .hover-lift {
            transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s ease;
        }
        .hover-lift:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 20px 40px -12px rgba(124,58,237,0.18);
        }

        /* Shimmer button */
        .btn-shimmer {
            background-size: 200% auto;
            transition: background-position 0.4s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-shimmer:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(124,58,237,0.45);
        }
        .btn-shimmer:active { transform: translateY(0); }

        /* Floating icon */
        .icon-float { animation: float 3.5s ease-in-out infinite; }

        /* Pulsing ring on focus-worthy elements */
        .pulse-ring:hover { animation: pulse-ring 1.2s ease infinite; }

        /* Animated gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #7c3aed, #a855f7, #6d28d9, #7c3aed);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 4s ease infinite;
        }

        /* Input focus animation */
        input:focus, select:focus, textarea:focus {
            transition: all 0.25s ease;
        }

        /* Scroll-reveal (JS-driven) */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Table row hover */
        .tr-hover { transition: background 0.2s ease, transform 0.15s ease; }
        .tr-hover:hover { background: rgba(124,58,237,0.04); }

        /* Stat card number count animation */
        .stat-number { animation: countUp 0.5s ease both; }

        /* Navbar link underline animation */
        .nav-link {
            position: relative;
            transition: color 0.2s ease;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -3px; left: 0;
            width: 0; height: 2px;
            background: #7c3aed;
            border-radius: 2px;
            transition: width 0.25s ease;
        }
        .nav-link:hover::after { width: 100%; }

        /* Badge pop */
        .badge-pop {
            transition: transform 0.2s cubic-bezier(.34,1.56,.64,1);
        }
        .badge-pop:hover { transform: scale(1.1); }

        /* Ripple effect on buttons */
        .ripple {
            position: relative;
            overflow: hidden;
        }
        .ripple::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .ripple:active::after { opacity: 1; }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body class="bg-[#F8F8FB] text-slate-900">
    {% block content %}{% endblock %}

    <!-- Global scroll-reveal script -->
    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((e, i) => {
                if (e.isIntersecting) {
                    setTimeout(() => e.target.classList.add('visible'), i * 80);
                    observer.unobserve(e.target);
                }
            });
        }, { threshold: 0.12 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
