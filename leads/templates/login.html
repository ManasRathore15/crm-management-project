{% extends 'base.html' %}

{% block title %}Staff Login{% endblock %}

{% block content %}

<div class="min-h-screen bg-[#F8F8FB] flex items-center justify-center px-6 relative overflow-hidden">

    <!-- Animated background blobs -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-violet-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30"
         style="animation: float 7s ease-in-out infinite;"></div>
    <div class="absolute bottom-0 right-1/4 w-80 h-80 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-25"
         style="animation: float 9s ease-in-out infinite reverse;"></div>
    <div class="absolute top-1/2 left-0 w-64 h-64 bg-indigo-100 rounded-full mix-blend-multiply filter blur-3xl opacity-20"
         style="animation: float 11s ease-in-out infinite;"></div>

    <div class="w-full max-w-md relative anim-scale-in">

        <div class="bg-white rounded-[32px] border border-slate-200 shadow-xl shadow-violet-100/40 p-10
                    hover:shadow-2xl hover:shadow-violet-200/50 transition-shadow duration-500">

            <!-- Icon -->
            <div class="flex justify-center">
                <div class="w-14 h-14 bg-violet-600 rounded-2xl flex items-center justify-center
                            shadow-lg shadow-violet-300 icon-float pulse-ring cursor-pointer
                            hover:scale-110 hover:rotate-6 transition-transform duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 3l7 4v5c0 5-3.5 8.5-7 9-3.5-.5-7-4-7-9V7l7-4z"/>
                    </svg>
                </div>
            </div>

            <!-- Heading -->
            <h1 class="text-center text-4xl font-extrabold text-slate-900 mt-6 anim-fade-up delay-100">Staff Login</h1>
            <p class="text-center text-slate-500 mt-2 anim-fade-up delay-200">Admin & Agent access only</p>

            <!-- Error -->
            {% if error %}
            <div class="mt-5 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm anim-scale-in
                        animate-shake">
                {{ error }}
            </div>
            {% endif %}

            <!-- Form -->
            <form method="POST" class="mt-8 space-y-4">
                {% csrf_token %}

                <div class="anim-fade-up delay-300">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Username</label>
                    <div class="relative group">
                        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-300 group-focus-within:text-violet-500 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <input type="text" name="username" required placeholder="Enter username"
                               class="w-full border border-slate-200 rounded-xl pl-12 pr-4 py-4
                                      focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent
                                      hover:border-violet-300 transition-all duration-200
                                      focus:shadow-lg focus:shadow-violet-100">
                    </div>
                </div>

                <div class="anim-fade-up delay-400">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                    <div class="relative group">
                        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-300 group-focus-within:text-violet-500 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                        <input type="password" name="password" required placeholder="Enter password" id="passwordInput"
                               class="w-full border border-slate-200 rounded-xl pl-12 pr-12 py-4
                                      focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent
                                      hover:border-violet-300 transition-all duration-200
                                      focus:shadow-lg focus:shadow-violet-100">
                        <!-- toggle eye -->
                        <button type="button" id="togglePwd"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 hover:text-violet-500 transition-colors duration-200">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="anim-fade-up delay-500">
                    <button type="submit"
                            class="w-full py-4 rounded-xl
                                   bg-gradient-to-r from-violet-600 via-purple-600 to-violet-600
                                   bg-size-200
                                   text-white font-semibold text-lg
                                   shadow-lg shadow-violet-200
                                   btn-shimmer ripple
                                   transition-all duration-300 mt-2
                                   hover:-translate-y-1 hover:shadow-xl hover:shadow-violet-300
                                   active:translate-y-0 active:shadow-md">
                        Login to Dashboard
                    </button>
                </div>
            </form>


            <!-- Back Link -->
            <div class="text-center mt-8 anim-fade-up delay-700">
                <a href="/" class="text-slate-400 hover:text-violet-600 transition-colors duration-200 text-sm group inline-flex items-center gap-1">
                    <span class="transition-transform duration-200 group-hover:-translate-x-1">←</span>
                    Back to Home
                </a>
            </div>

        </div>
    </div>
</div>

<script>
    const togglePwd = document.getElementById('togglePwd');
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');
    if (togglePwd) {
        togglePwd.addEventListener('click', () => {
            const isText = passwordInput.type === 'text';
            passwordInput.type = isText ? 'password' : 'text';
            eyeIcon.style.opacity = isText ? '0.4' : '1';
        });
    }
</script>

{% endblock %}
